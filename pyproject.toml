[project]
name = "vol-diagram-kit"
version = "0.1.0"
description = "Deterministic diagram-as-code: one YAML spec -> Mermaid, SVG, PNG, draw.io and Lucid-importable XML."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pyyaml==6.0.3",
    "resvg-py==0.5.0",
]

[project.optional-dependencies]
cairo = [
    "cairosvg==2.9.1",
]
browser = [
    "playwright==1.64.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "fonttools==4.68.0",
    "pytest==9.2.0",
]
